evidence = "Historical record through round 3, retaining the earlier reviewers' session-local wording: Preserves M1-R2-F1 critical attribution and existing Nicely block grade. At f691b68:png.go:70-76 decoded nonopacity enables Gray-alpha while retaining the original Gray model and native precision. Both independent final delta sessions replay all preserved 8/16-bit orientation-1/2 type-0+tRNS inputs and explicit type-4 controls with resize. This readiness session freshly reruns all eight original combinations, unchanged-size and side 32. The original 1024 transparent and 1024 opaque samples survive; resized boundary alpha remains. Eleven fresh Gray 1/2/4/8/16, RGB 8/16 and palette 1/2/4/8 representations at orientation 6 and side 31 pass the complete reader. Separate CRC/zlib/raw-sample audits verify actual transparency and complete profile equality, with 16-bit outputs remaining wide and Gray outputs using model 4. Malformed Gray/RGB/palette tRNS pairs refuse preview and run. An otherwise valid opaque Gray substitute fails specifically at channel 3 alpha difference 65535, bound 5140, in the resized control. The committed no-resize opaque control fails at alpha bound 8 in manic-2-delta/evidence/opaque-control.log. See readiness-r3/evidence/fresh-probes.json, raw-transparency-audit.json and both delta raw alpha/family audits. Round-4 independent regression review at 38e30db: the complete suite freshly executes all committed Gray 1/2/4/8/16-bit, RGB 8/16-bit and palette 1/2/4/8-bit tRNS paths, unchanged-size and resized, orientation and explicit-alpha controls, malformed Gray/RGB/palette refusals and compatible opaque-output negative. The decoded-opacity Gray-alpha repair is unchanged. The cubic reference also freshly accepts separate random low/partial/full-alpha reductions across every orientation and both depths."
