[[findings]]
id = "R1-F3"
title = "The fidelity reader rejects faithful odd-factor reductions"
severity = "block"
state = "fixed"
spec = "pixels"
family = "Resampling footprints"
evidence = "Historical round-3 evidence, retained without a grade reduction: Preserves original manic-1 F2 attribution, related manic-2 fidelity evidence, M2-R2-F2 aliasing history and the existing block grade. 18247d4 now integrates every source pixel with fractional area in premultiplied RGBA and removes the earlier four-point aliasing. The old black/transparent substitutions no longer certify. M1-DELTA-F1 is a residual of this same finding, not a new ID or a severity reduction. At f691b68:testdata/script/acceptance.txtar:1489-1531 the box-relative mean limits reject faithful CatmullRom PNG reductions. Fresh default-size 14336x128 16-bit alpha input shrinks 34878 to 948 bytes at 2048x18; the current reader exits 2 at color mean difference 18.262/255 against 8/255. A separately authored exact-rational cubic polynomial predicts all 36864 output RGBA pixels with maximum difference zero in every channel, again after force. Independent complete-pixel audit measures box-relative mean absolute difference 18.262459721546694/255 in every channel, also exceeding resized-alpha 4/255. The 133x67 orientation-8 side-19 alpha and opaque cases fail at 17.619/255; matched 6:1 and 8:1 controls pass, while black/transparent substitutes still fail. Both final delta reports inspected the complete-area loops; manic-2 retained no new finding in its probes but did not exercise this odd-factor witness. This is acceptance false rejection, with no demonstrated product pixel damage or surviving total-corruption certification. See readiness-r3/evidence/fresh-probes.json, second-pass.json, raw-transparency-audit.json and probes/second_pass.py; manic-1-delta/evidence/independent-kernel-audit.json, its repeat, fraction-followup-summary.json and default-seven-no-override-reader.log. Round-4 repair and independent closure at 38e30db: 108f765 adds the whole odd/even/fractional good/bad family and its actual failing-first log reaches scenario line 12 after successful 34878-to-948 processing, then rejects mean 18.262 against 8. d53d449 independently evaluates the BC cubic polynomial B=0,C=1/2 with signed full support, clipped-edge normalization, oriented premultiplied samples and bounded horizontal row caching, with no product scaler import/call. Every destination pixel and the aggregate guard remain; resized-PNG bounds are two 8-bit levels per pixel and mean one, or eight native units for 16-bit samples. Exact PNG and lossy complete-area/chroma paths remain. The stdout-only correction at 6cc7cf4 restores reads' fixed reference text; its preceding diagnostic gate failure is distinct from the behavioral first failure. This reviewer freshly ran the entire final-head just check plus default and odd supplied-fixture acceptance. The original default 14336x128 alpha witness now passes the reader before/after force, repeats identical bytes and independently matches every one of its 36864 output RGBA pixels with zero rational prediction error. Sixteen separately generated 23x17 full-range random RGBA cases cross both depths and all eight orientations at side 7, with zero/low/partial/full alpha; complete rational predictions differ by at most 219/65535 for 8-bit and 1/65535 for 16-bit samples. Every good output accepts and every matched valid-metadata black substitute fails on pixels. Default black/transparent controls fail too. Fresh last-pixel 3-level/9-unit errors and uniform 2-level 8-bit drift demonstrate both guards remain live; allowed 1-level/8-unit controls pass. Committed default7x, opaque7x, 6x/8x, fractional all-orientation/depth and 2-D partial-alpha pairs pass. Both earlier independent manic3/manic5 sessions at 9135810 supply separately attributed exact-rational, edge-geometry and bound audits, not readiness or coverage of the later cleanup. See readiness-r4/raw/probes.json, rational.json, check.log, acceptance-default.log, acceptance-odd.log and preserved complete paired evidence. No remaining counterexample or promise narrowing is retained."
command = "Independent acceptance checks for ncly image shrink resized PNG, JPEG and WebP outputs"
consequence = "The original skipped-band and aliased-reference false certifications and the later odd-factor false rejection are repaired. Required independent complete-content proof now accepts faithful supported outputs and refuses matched content corruption in the exercised family. This closes an acceptance-proof defect, without inventing historical product pixel damage."
owner = "Cook 1.1, independent acceptance reader and references"
fix = "Implemented independent complete cubic PNG prediction and whole-family good/bad controls. Retain the every-pixel and aggregate guards, native precision, orientation, premultiplied alpha, valid metadata negatives and separate exact/lossy paths. No product limit is accepted."
