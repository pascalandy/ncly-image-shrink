["image-shrink.summary"]
description = "Help summary of the sharing-copy command"
other = "Make a smaller image for sharing, without descriptive metadata"

["image-shrink.file"]
description = "Input argument in help"
other = "One local JPEG, PNG or static WebP image"

["image-shrink.max_side"]
description = "Help for the maximum dimension"
other = "Longest output side in pixels, from 1 to 40000, without enlargement"

["image-shrink.quality"]
description = "Help for the lossy quality value"
other = "JPEG and WebP quality from 1 to 100; PNG stays lossless"

["image-shrink.timeout"]
description = "Help for the processing deadline"
other = "Bound the vips probe and processing together, at most 30s"

["image-shrink.force"]
description = "Help for replacing a sharing copy"
other = "Replace an existing regular sharing copy after processing succeeds"

["image-shrink.hint"]
description = "Next action after an image command failure"
other = "Check the input and destination, then preview with ncly image shrink --dry-run --json. Use a JPEG, PNG or static WebP within the 64 MiB and 40 million pixel limits."

["image-shrink.options"]
description = "Invalid command option value, File is the input path"
other = "Invalid size, quality or timeout for {{.File}}. Use a positive size up to 40000, quality 1 to 100, and a positive duration up to 30s."

["image-shrink.input"]
description = "Unreadable, damaged or incomplete input, File is the supplied path"
other = "{{.File}} is not a readable, complete regular image file."

["image-shrink.format"]
description = "Unsupported type or mismatched extension, File is the supplied path"
other = "{{.File}} must contain JPEG, PNG or WebP bytes matching its .jpg, .jpeg, .png or .webp extension."

["image-shrink.limit"]
description = "Resource budget exceeded, File is the supplied path"
other = "{{.File}} exceeds 64 MiB, 40 million pixels, or 40000 pixels on one side."

["image-shrink.multipart"]
description = "Animation or multiple pictures, File is the supplied path"
other = "{{.File}} contains animation or several images. Shrink one still image instead."

["image-shrink.output"]
description = "Unsafe output path, File is the supplied input path"
other = "The sharing-copy path of {{.File}} is not a separate regular file. Remove its link or choose another input path."

["image-shrink.exists"]
description = "Destination conflict, File is the supplied input path"
other = "The sharing copy of {{.File}} already exists. Inspect it, then use --force to replace it."

["image-shrink.publish"]
description = "Publication failed, File is the supplied input path"
other = "Cannot publish the sharing copy of {{.File}}. Check destination permissions and support for hard links or atomic replacement."

["image-shrink.cleanup"]
description = "Private stage cleanup failed after the call, File is the supplied input path"
other = "Cannot remove the private staging folder beside {{.File}}. Keep any completed output and inspect the .ncly-image-shrink- folder."

["image-shrink.result"]
description = "Candidate did not meet preservation checks, File is the supplied input path"
other = "The candidate for {{.File}} failed image, geometry or color-profile validation. No output was published."

["image-shrink.not_smaller"]
description = "The candidate saves no bytes, File is the supplied input path"
other = "The candidate for {{.File}} is not smaller. No output was published. Try a smaller --max-side or lower JPEG or WebP --quality."

["image-shrink.preview"]
description = "Human dry-run result, Output is the destination path"
other = "Planned copy: {{.Output}}. Size saving and publication remain pending."

["image-shrink.done"]
description = "Human success result, Output is the destination and Bytes its size"
other = "Wrote {{.Output}}, {{.Bytes}} bytes."
