# English catalog of the image-shrink extension. Each entry needs a description
# of where the text appears, for the translator. A text between {{ and }} is
# a field that the handler fills.

["image-shrink.inspect.summary"]
description = "Help page: summary of `ncly image shrink`, which gives the size and the line count of a file."
other = "Give the size and the line count of a file"

["image-shrink.inspect.file"]
description = "Help page: the file argument of `ncly image shrink`."
other = "File to inspect"

["image-shrink.inspect.timeout"]
description = "Help page: the --timeout flag of `ncly image shrink`, which bounds the run of its worker."
other = "Stop the inspection after this duration"

["image-shrink.inspect.no_file"]
description = "Message of USAGE_INVALID when the file of `ncly image shrink` is missing or is no regular file. {{.File}} is the path that the caller gave."
other = "{{.File}} is no file that image shrink can inspect."

["image-shrink.inspect.bad_timeout"]
description = "Message of USAGE_INVALID when the --timeout of `ncly image shrink` is no positive duration. {{.Timeout}} is the value that the caller gave, and --timeout stays as is."
other = "--timeout {{.Timeout}} is no duration, such as 30s or 5m."

["image-shrink.inspect.result"]
description = "Text of `ncly image shrink`: the line count and the size of the file. {{.File}} is the path that the caller gave, {{.Count}} the line count, and {{.Size}} the size with its unit, such as 12 B."
one = "{{.File}}: {{.Count}} line, {{.Size}}"
other = "{{.File}}: {{.Count}} lines, {{.Size}}"

["image-shrink.inspect.not_text"]
description = "Message of IMAGE_SHRINK_NOT_TEXT when the file of `ncly image shrink` holds a NUL byte, such as an image, so its lines mean nothing. {{.File}} is the path that the caller gave."
other = "{{.File}} is no text file, so its lines mean nothing."

["image-shrink.inspect.not_text_hint"]
description = "Hint of IMAGE_SHRINK_NOT_TEXT, which names a text file to inspect instead. {{.File}} is the path that the caller gave."
other = "Give ncly image shrink a text file, such as notes.md, instead of {{.File}}."
