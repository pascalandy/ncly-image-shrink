[[facts]]
kind = "sourced"
statement = "Program: vips thumbnail reads one local image and writes the path selected by its output suffix. CLI options follow the operation. It does not ask a question."
source = "https://github.com/libvips/libvips/blob/v8.18.7/doc/using-the-cli.md"
revision = "v8.18.7"
read = "Optional arguments and Implicit file format conversion, including bracketed loader and saver options"

[[facts]]
kind = "sourced"
statement = "Geometry: thumbnail fits inside a square, applies EXIF orientation by default, and size=down prevents enlargement. Without an output_profile it does not request an ICC transform."
source = "https://github.com/libvips/libvips/blob/v8.18.7/libvips/resample/thumbnail.c"
revision = "v8.18.7"
read = "vips_thumbnail documentation and vips_thumbnail_build, especially needs_icc_transform, size, and auto_rotate"

[[facts]]
kind = "sourced"
statement = "Privacy: keep=icc drops EXIF, XMP, IPTC and optional comments while retaining ICC. An incompatible ICC can be silently dropped, so the adapter must verify preservation before publication."
source = "https://github.com/libvips/libvips/blob/v8.18.7/libvips/foreign/foreign.c"
revision = "v8.18.7"
read = "vips_foreign_get_keep, vips_foreign_save_remove_metadata and vips__foreign_update_metadata"

[[facts]]
kind = "sourced"
statement = "JPEG quality is Q, with optimized Huffman coding available. The output is lossy."
source = "https://github.com/libvips/libvips/blob/v8.18.7/libvips/foreign/jpegsave.c"
revision = "v8.18.7"
read = "vips_jpegsave documentation, Q and optimize_coding"

[[facts]]
kind = "sourced"
statement = "PNG uses lossless compression from 0 to 9. Palette quantization is optional and must remain disabled. RGB, alpha, monochrome and 16-bit samples are supported."
source = "https://github.com/libvips/libvips/blob/v8.18.7/libvips/foreign/pngsave.c"
revision = "v8.18.7"
read = "vips_pngsave documentation, compression, palette and bitdepth"

[[facts]]
kind = "sourced"
statement = "WebP defaults to lossy compression controlled by Q. Alpha quality defaults to 100. Animated input can have several frames, but thumbnail defaults to only the first frame, so the adapter must refuse animation."
source = "https://github.com/libvips/libvips/blob/v8.18.7/libvips/foreign/webpsave.c and libvips/resample/thumbnail.c"
revision = "v8.18.7"
read = "vips_webpsave documentation, Q, alpha_q and lossless, and vips_thumbnail documentation on first-frame loading"

[[facts]]
kind = "sourced"
statement = "Exit codes: vips exits 0 on success and nonzero on error. Its loaders are permissive by default. fail_on=warning requests a refusal instead of publishing damaged input."
source = "https://github.com/libvips/libvips/blob/v8.18.7/man/vips.1 and libvips/resample/thumbnail.c"
revision = "v8.18.7"
read = "RETURN VALUE and vips_thumbnail documentation on fail_on"

[[facts]]
kind = "inference"
statement = "The wrapper needs no key, login, network, or payment. It accepts only validated JPEG, PNG and static WebP bytes, uses fixed private snapshot names, and never relays an operation or loader option from a user path. It removes the snapshot after the call."

[[facts]]
kind = "inference"
statement = "Resource policy: cap compressed input at 64 MiB and expanded input at 40 million pixels before decoding. Limit the vips call, including its version probe, to 30 seconds. One processing thread and a 64 MiB operation cache reduce memory use, but that cache is not an operating-system memory ceiling."

[[facts]]
kind = "inference"
statement = "Display declarations to cover are EXIF orientation, ICC color profiles, PNG gamma and chromaticity, PNG bit depth and transparency, JPEG CMYK and Adobe markers, and WebP alpha. Multipage JPEG and animated PNG or WebP must be refused instead of losing parts."

[[experiments]]
command = "vips --version"
result = "Exit 0, vips-8.18.7 on om1. stderr also warns that the optional openslide plugin cannot load libopenslide.so.1. The selected JPEG, PNG and WebP operations do not use that plugin."

[[facts]]
kind = "sourced"
statement = "Thumbnail always converts or exports at depth 8. PNG must therefore prepare orientation and resizing at native precision before vips copy compresses it, so a 16-bit input is not quantized."
source = "https://github.com/libvips/libvips/blob/v8.18.7/libvips/resample/thumbnail.c"
revision = "v8.18.7"
read = "vips_thumbnail_build, non-linear processing-space conversion and the Colour management block stating that export always uses depth 8"

[[facts]]
kind = "sourced"
statement = "Without an ICC transform, thumbnail still converts three-or-more-band input to sRGB in non-linear processing. A CMYK input can therefore lose compatibility with its original CMYK profile even when no profile transform was requested."
source = "https://github.com/libvips/libvips/blob/v8.18.7/libvips/resample/thumbnail.c"
revision = "v8.18.7"
read = "vips_thumbnail_build, the non-linear branch at lines 792-807 and the processing-space colour conversion"

[[facts]]
kind = "sourced"
statement = "jpegload supports CMYK and YCbCr, and autorotate interprets the orientation while loading. Resize uses a scale factor, preserves aspect ratio and uses centered Lanczos3 reduction by default; it does not premultiply alpha. JPEG subsample_mode off sets each component's sampling factors to one."
source = "https://github.com/libvips/libvips/blob/v8.18.7/libvips/foreign/jpegload.c and libvips/resample/resize.c and libvips/foreign/vips2jpeg.c"
revision = "v8.18.7"
read = "vips_jpegload documentation for colour models and autorotate; vips_resize documentation for scale, kernel, aspect ratio and alpha; set_cinfo sampling factors at lines 676-689"

[[facts]]
kind = "inference"
statement = "Use jpegload autorotate plus one native-model resize operation for JPEG, with no second chroma subsampling. Keep PNG orientation/resizing in Go at native precision, explicitly encoding Gray and Gray-alpha to retain the relationship between samples and the original ICC profile. Refuse malformed or incompatible declarations before effects, and retain final complete ICC equality."
